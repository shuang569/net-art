    <div class="clock-wrapper">
        <div class="info">
            <div id="date">Date</div>
            <div id="time">Time</div>
        </div>
        <div class="shape circle">
            <img class="clock-hand" src="css/clock_hand.png">
            <img class="smallclock-hand" src="css/small_clock_hand.png">
            <img class="marks" src="css/clock_marks.png">
            <img class="marks" src="css/clock_marks2.png" style="opacity: 50%;">
            <div class="dot border" style="width: 483px; height: 483px; overflow: hidden;">
                <img class="gear" style="width: 100px; height: 100px;" src="css/gear2.png">
                <img class="gear" style="top: 72%; left: 20.8%; width: 330px; height: 330px;" src="css/gear1.png">

                <img class="gear" style="top: 10%; left: 80%; width: 300px; height: 300px;" src="css/gear2.png">
                
                <img class="gear" style="top: 75%; left: 80%; width: 700px; height: 700px;" src="css/circles2.png">
                <img class="gear" style="top: 55%; left: 60%; width: 200px; height: 200px;" src="css/circles.png">
                
            </div>

            <img src="css/bgCircle.png" style="position: absolute; width: 1066px; z-index: -1;">

            <div class="dot icon" style="top: -35%; left: -35%; width: 200px; height: 200px;"> 
                <div id="temp"> temperature </div>
            </div>
            <img class="gear" style="top: -14%; left: -14%; width: 230px; height: 230px;" src="css/circles2.png">
            <div class="dot icon" style="top: 90%; left: 90%; width: 300px; height: 300px;"> 
                <div id="weather"> weather </div>
                <div id="weatherEmoji"> Emoji </div>
            </div>
            <img class="gear" style="top: 117%; left: 117%; width: 330px; height: 330px; z-index: -1;" src="css/circles2.png">

            <div class="dot icon" style="top: -15%; left: 87%; width: 150px; height: 150px;">
                <div class="hourglassRings">
                    <img id="hourglass" src="css/hourglass.png">
                    <img class="rings" src="css/ring1.png" style="width: 100px; height: auto;">
                    <img class="rings" src="css/ring1.png" style="width: 110px; height: auto; animation-delay: .7s;">
                    <img class="rings" src="css/ring1.png" style="width: 120px; height: auto; animation-delay: 1.5s;">
                </div>
            </div>

            <div class="dot bottom"></div>
            <div class="dot left"></div>
