<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clock</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="shape circle">
        <img class="clock-hand" src="css/clock_hand.png">
        <div class="dot border"></div>
        <div class="dot border" style="width: 480px; height: 480px; overflow: hidden;">
            <div class="mini-circle" style="top: 60%; left: 70%; width: 200px; height: 200px;"></div>
            <div class="mini-circle" style="top: -5%; left: 15%; width: 430px; height: 430px;"></div>
            <div class="mini-circle" style="top: 40%; left: -10%; width: 300px; height: 300px;"></div>
            <img class="gear" style="width: 100px; height: 100px;" src="css/gears-icon.png">
            <img class="gear" style="top: 72%; left: 20.8%; width: 330px; height: 330px;" src="css/gears-icon.png">
            <img class="gear" style="top: 80.2%; left: 90%; width: 200px; height: 200px;" src="css/gears-icon.png">
            <img class="gear" style="top: 40%; left: 60%; width: 450px; height: 450px;" src="css/gears-icon.png">
            
        </div>
        <!-- <div class="dot border" style="width: 530px; height: 530px;"></div>  border: 10px dotted white -->
        <!-- <div class="dot" style="position: inherit;"></div> -->
         
        <div class="dot border" style="width: 530px; height: 530px; border: 5px solid #b17b189f;"></div>
        <div class="dot border" style="width: 600px; height: 600px; border: 4px solid #b17b189f;"></div>
        <div class="dot border" style="width: 730px; height: 730px; border: 6px solid #b17b189f;"></div>
        <div class="dot border" style="width: 750px; height: 750px; border: 2px solid #b17b189f;"></div>
        <div class="dot border" style="width: 1000px; height: 1000px; border: 2px solid #b17b189f;"></div>
        <div class="dot border" style="width: 1020px; height: 1020px; border: 2px solid #b17b189f;"></div>
        
        <div class="dot top"></div>
        <div class="dot right"></div>
        <div class="dot bottom"></div>
        <div class="dot left"></div>

        <div class="dot top icon lightyellow" style="top: -25%;"><img src="css/sun.png"></div>
        <div class="dot right icon red" style="right: -25%;"><img src="css/sunset.png"></div>
        <div class="dot left icon yellow" style="left: -25%;"><img src="css/sunrise.png"></div>
        <div class="dot bottom icon blue" style="bottom: -25%;"><img src="css/moon.png"></div>

    </div>
    
    <script src="js/script.js"></script>
</body>
</html>
