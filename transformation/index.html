<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Time of Day</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="shape circle">
        <div class="dot border"> <img class="clock-hand" src="css/clock_hand.png"> </div>
        <div class="dot border" style="width: 480px; height: 480px;"></div>
        <!-- <div class="dot border" style="width: 530px; height: 530px;"></div>  border: 10px dotted white -->
        <!-- <div class="dot" style="position: inherit;"></div> -->
        <div class="dot top"></div>
        <div class="dot right"></div>
        <div class="dot bottom"></div>
        <div class="dot left"></div>

        <div class="dot top icon lightyellow" style="top: -25%;"><img src="css/sun.png"></div>
        <div class="dot right icon red" style="right: -25%;"><img src="css/sunset.png"></div>
        <div class="dot left icon yellow" style="left: -25%;"><img src="css/sunrise.png"></div>
        <div class="dot bottom icon blue" style="bottom: -25%;"><img src="css/moon.png"></div>

    </div>
    
    <script src="js/script.js"></script>
</body>
</html>
